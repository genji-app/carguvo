name: carguvo
description: "Carguvo - Quản lý hàng hóa trên xe tải"
publish_to: "none"
version: 2.0.0+11

environment:
  # Bump từ ^3.8.1: `unlock_shorebird_kit` yêu cầu sdk ^3.10.0,
  # `sun_sports` yêu cầu ^3.9.2 → giao là ^3.10.0.
  sdk: ^3.10.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_fonts: ^6.2.1
  uuid: ^4.5.1
  intl: ^0.20.2
  # Dùng trực tiếp trong lib/root_gate.dart (ProviderScope + Override)
  # cho cây widget của sun_sports. Constraint khớp sun_sports.
  flutter_riverpod: ^2.5.1

  # ===== Local packages (nằm trong repo, thư mục `package/`) =====
  # Cover/unlock gate + Shorebird update UI.
  unlock_shorebird_kit:
    path: package/unlock_shorebird_kit
  # Toàn bộ app s88 đóng gói lại thành package (AppMode.betting).
  app_package:
    path: package/app_package

  # Restart process thật (terminate: true) — BẮT BUỘC để Shorebird apply patch.
  # Widget-remount không apply patch vì VM vẫn chạy snapshot cũ.
  terminate_restart: 1.1.0  # pinned by shorebird_preflight (trước: ^1.1.0)

  # ===== PRE-BUNDLE native plugin cho Shorebird =====
  # Shorebird patch CHỈ thay được Dart code, KHÔNG thêm được plugin native.
  # Mọi plugin mà `sun_sports` dùng phải nằm sẵn trong binary release, nếu
  # không sẽ ném MissingPluginException ở runtime (~5ms, mọi lần gọi).
  # Constraint để TRÙNG KHỚP với package/sun_sports_package/pubspec.yaml —
  # đổi bên đó thì phải đổi ở đây rồi RELEASE BINARY MỚI (patch không đủ).
  connectivity_plus: 6.1.5  # pinned by shorebird_preflight (trước: ^6.1.0)
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0
  device_info_plus: 11.5.0  # pinned by shorebird_preflight (trước: ^11.5.0)
  package_info_plus: 9.0.1  # pinned by shorebird_preflight (trước: ^9.0.1)
  wakelock_plus: 1.5.2  # pinned by shorebird_preflight (trước: ^1.4.0)
  url_launcher: ^6.2.5
  fluttertoast: 8.2.14  # pinned by shorebird_preflight (trước: ^8.2.8)
  webview_flutter: ^4.11.2
  webview_flutter_wkwebview: 3.26.1  # pinned by shorebird_preflight (trước: ^3.23.7)
  flutter_inappwebview: ^6.1.5
  video_player: ^2.9.2
  flutter_in_app_pip: ^1.7.4
  audioplayers: ^6.5.1
  pinput: ^6.0.1
  rive: ^0.14.9
  rive_native: 0.1.11  # pinned by shorebird_preflight (trước: ^0.1.11)
  sentry_flutter: 9.30.0  # pinned by shorebird_preflight (trước: ^9.24.0)
  clarity_flutter: 1.10.0  # pinned by shorebird_preflight (trước: ^1.9.0)

  # >>> shorebird_preflight: native plugins (tự sinh — đừng sửa tay, chạy `fix` để cập nhật)
  # Plugin native có trong cây (thường đến từ app_package) nhưng pubspec gốc
  # chưa khai trực tiếp. Ghim đúng version trong pubspec.lock để binary release
  # luôn chứa đủ native, kể cả khi build release không kèm app_package.
  audioplayers_android: 5.3.0
  audioplayers_darwin: 6.5.0
  flutter_inappwebview_android: 1.1.3
  flutter_inappwebview_ios: 1.1.2
  game_engine:
    path: /Users/admin/Documents/projects/app_package/packages/game_engine
  jni: 0.14.2
  path_provider_android: 2.2.19
  path_provider_foundation: 2.4.2
  pointer_interceptor_ios: 0.10.1+1
  shared_preferences_android: 2.4.28
  shared_preferences_foundation: 2.5.7
  sqflite_android: 2.4.4
  sqflite_darwin: 2.4.4
  url_launcher_android: 6.3.33
  url_launcher_ios: 6.4.2
  video_player_android: 2.12.2
  video_player_avfoundation: 2.12.0
  webview_flutter_android: 4.14.1
  # <<< shorebird_preflight

dependency_overrides:
  # >>> shorebird_preflight: path overrides (tự sinh từ PATH_OVERRIDES — chạy `fix` để cập nhật)
  app_env:
    path: /Users/admin/Documents/projects/app_package/packages/app_env
  game_engine:
    path: /Users/admin/Documents/projects/app_package/packages/game_engine
  # <<< shorebird_preflight overrides

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - shorebird.yaml

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 24
