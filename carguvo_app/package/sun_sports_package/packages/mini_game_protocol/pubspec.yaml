name: mini_game_protocol
description: >-
  Protocol mini game DÙNG CHUNG app Flutter + jaspr_web (tách 10/09/2026 —
  Phase 7 của PACKAGING_PLAN.md, mục 5.2; gốc JS `MiniGameNetworkHandler.ts`):
  enum MessageRequest/MessageResponse + GameIds, codec packet MẢNG JSON
  (RawMessage), message từng game (tai_xiu / slot / tren_duoi + UpDownMsg keys)
  và JackpotData. Pure Dart; model dùng freezed (precedent auth_domain, file
  generate được commit). KHÔNG thuộc package: transport (socket client), ping
  manager, sender, controller, plugin render — là của host.
version: 0.1.0
publish_to: none

environment:
  # Bám app_env (>=3.9.2) — đủ cho app Flutter lẫn jaspr_web (Dart ^3.11).
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  freezed_annotation: ^3.1.0

dev_dependencies:
  # Codegen chạy TRONG package (`dart run build_runner build`) — file
  # .freezed.dart được commit, host không cần chạy build_runner.
  build_runner: ^2.10.1
  # Test Timer của ping loop (fake clock, không sleep thật).
  fake_async: ^1.3.3
  freezed: ^3.2.3
  lints: ^5.0.0
  test: ^1.25.0