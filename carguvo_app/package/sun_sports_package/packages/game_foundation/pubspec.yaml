  dart_kit:
    path: ../dart_kit
  # Cooldown lifecycle + periodic clear đọc giờ qua clock — fake_async test được.
  clock: ^1.1.2
  # GameLauncherState.activeGame (LobbyGame) + SunGameStatus (lifecycle).
  provider_game_manager:
    path: ../provider_game_manager

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
