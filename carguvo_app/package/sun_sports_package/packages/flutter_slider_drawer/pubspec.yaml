name: flutter_slider_drawer
description: >-
  A Flutter package with custom implementation of the Slider Drawer Menu.
  FORK nội bộ (pub.dev). FLUTTER ONLY — KHÔNG dùng được cho jaspr_web.
version: 3.0.2
# Round 8 (W10): fork nội bộ (xem khối dưới) nhưng trùng tên package THẬT trên
# pub.dev — chặn `dart pub publish` nhầm. Mọi package khác trong `packages/` đã có.
publish_to: none
homepage: https://github.com/NikhilVadoliya/Flutter_slider_drawer
issue_tracker: https://github.com/NikhilVadoliya/Flutter_slider_drawer/issues
maintainer: Nikhil Vadoliya

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  # G5 (16/09/2026): trước đây KHÔNG khai lints nào — thêm chuẩn flutter_lints.
  flutter_lints: ^6.0.0


