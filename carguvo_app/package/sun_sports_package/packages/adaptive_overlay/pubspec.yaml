name: adaptive_overlay
description: >-
  A reusable Flutter package for building adaptive overlays with internal
  navigation. FLUTTER ONLY (Flutter widgets) — KHÔNG dùng được cho jaspr_web.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.9.2 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

# Round 8 (W4): package này TRƯỚC ĐÂY không có `dev_dependencies` nào (không có
# test, không khai lints) ⇒ 0 rule nào chạy. Nay khai `flutter_lints` để
# `analysis_options.yaml` mới thêm có hiệu lực.
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
