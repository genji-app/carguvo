name: mini_game_countdown_core
description: "Countdown core logic shared between app Flutter + jaspr_web (Phase 3.3 candidate — Round 6)."
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  # Message types Tài Xỉu (TaiXiuSubscribeInfo/StartGame/ShowResult) — freezed
  # model chung app + web. Controller chỉ tiêu biểu đã parse của host.
  mini_game_protocol:
    path: ../mini_game_protocol
  # Clock injectable — fakeAsync (test) vá zone này nên unit test điều khiển
  # được thời gian đếm ngược; prod trả giờ thật.
  clock: ^1.1.2

dev_dependencies:
  test: ^1.25.0
  fake_async: ^1.3.1
  lints: ^5.0.0