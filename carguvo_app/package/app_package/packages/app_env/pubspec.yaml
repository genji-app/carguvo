name: app_env
description: >-
  Môi trường (staging / pre-release / prod) + các URL config DÙNG CHUNG cho app
  Flutter và jaspr_web. Pure Dart, không phụ thuộc nền tảng. Từ Phase 6
  (10/09/2026) còn giữ luật store nhỏ (recent list, key game casino, key sound)
  và hằng + predicate bảo trì SB (quyết D2 — gom vào đây, không tạo package riêng).
version: 0.1.0
publish_to: none

environment:
  # Trần dưới >=3.9.2 (quy ước chung các package pure Dart) — đủ cho app
  # Flutter lẫn jaspr_web (Dart ^3.11) resolve được.
  sdk: ">=3.9.2 <4.0.0"

dev_dependencies:
  test: ^1.25.0
  lints: ^5.0.0
