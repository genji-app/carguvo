name: chat_protocol
description: >-
  State machine chat WebSocket DÙNG CHUNG app Flutter + jaspr_web (Round 4 —
  mục 1.1 của SHARED_PACKAGES_ROUND4.md, 11/09/2026): timers (health-check 5s
  gộp watchdog+ping, proactive refresh, retry backoff), orchestration recover
  (debounce, refresh, dial, fatal/transient), state phiên (loggedIn, connectedAt,
  killed, pingId, retryAttempts, queue pre-login) và dispatcher frame JSON.
  Pure Dart; transport + refresh phiên + vòng đời UI là CỦA HOST qua hooks
  (app: BaseWebSocket/TokenErrorHandler/NetworkManager; web:
  web_socket_channel/AuthState.ensureFreshSession/AppLifecycleHub).
  Wire protocol helpers (ChatWsCommand, payload builders, backoff formula,
  proactive delay) sống ở package `auth_domain` — dependency một chiều.
version: 0.1.0
publish_to: none

environment:
  # Bám app_env (>=3.9.2) — đủ cho app Flutter lẫn jaspr_web (Dart ^3.11).
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  # Machine đọc giờ qua `clock` (mặc định = DateTime.now()) — để fake_async
  # drive được timer + mốc thời gian trong test.
  # G2-2 (16/09/2026): GỠ dep auth_domain — wire helpers (ChatWsCommand,
  # payload builders, backoff, proactive delay) đã về `src/chat_wire.dart`.
  clock: ^1.1.2

dev_dependencies:
  # Test Timer của machine (fake clock, không sleep thật).
  fake_async: ^1.3.3
  lints: ^5.0.0
  test: ^1.25.0